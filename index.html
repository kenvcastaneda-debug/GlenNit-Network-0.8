<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070a12">
<title>AI Video Studio</title>
<style>
:root{--bg:#070a12;--card:#101522;--card2:#151b2b;--text:#f5f7ff;--muted:#8f9ab3;--line:#252d40;--accent:#8b5cf6;--accent2:#6d28d9}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -10%,#1b1235 0,#070a12 42%);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh}
main{width:min(720px,100%);margin:auto;padding:18px 14px 40px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.brand{display:flex;gap:10px;align-items:center}.logo{width:42px;height:42px;border-radius:13px;background:linear-gradient(135deg,#a78bfa,#6d28d9);display:grid;place-items:center;font-size:21px}.brand h1{font-size:20px;margin:0}.brand p{margin:2px 0 0;color:var(--muted);font-size:12px}.badge{font-size:11px;color:#c4b5fd;background:#1d1534;border:1px solid #3a2b65;border-radius:999px;padding:6px 9px}
.card{background:rgba(16,21,34,.92);border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:14px;box-shadow:0 12px 35px #0005}.label{font-size:12px;color:var(--muted);margin-bottom:8px;display:block}textarea,select{width:100%;background:#0b0f19;border:1px solid #2b3449;color:var(--text);border-radius:13px;padding:12px;font:inherit;outline:none}textarea{min-height:120px;resize:vertical}textarea:focus,select:focus{border-color:#7c5ce7}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.styles{display:flex;flex-wrap:wrap;gap:8px}.chip{border:1px solid #30384c;background:#0c111c;color:#bac3d6;border-radius:999px;padding:8px 11px;font-size:12px;cursor:pointer}.chip.active{background:#27184d;border-color:#8b5cf6;color:#eee8ff}.generate{width:100%;border:0;border-radius:14px;margin-top:14px;padding:14px;background:linear-gradient(135deg,#9b7cff,#6d28d9);color:#fff;font-weight:800;font-size:15px;cursor:pointer}.generate:disabled{opacity:.6}.status{margin-top:10px;text-align:center;color:#aeb8cd;font-size:12px;min-height:18px}.video-wrap{background:#05070d;border:1px solid var(--line);border-radius:16px;overflow:hidden;min-height:260px;display:grid;place-items:center}.video-wrap video{width:100%;max-height:70vh;display:block}.empty{text-align:center;color:#69758d;padding:60px 20px}.history-item{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid #20283a}.history-item:last-child{border-bottom:0}.history-item span{font-size:12px;color:#b9c2d4;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.history-item small{color:#68748c;display:block;margin-top:3px}.actions{display:flex;gap:8px;margin-top:10px}.action{flex:1;text-align:center;text-decoration:none;padding:11px;border-radius:12px;border:1px solid #30384c;color:#dbe1ef;background:#0b0f19;font-size:13px}.note{font-size:11px;color:#6e7890;line-height:1.5;margin-top:10px}
</style>
</head>
<body>
<main>
  <header class="top"><div class="brand"><div class="logo">▶</div><div><h1>AI Video Studio</h1><p>Real text-to-video generator</p></div></div><div class="badge">RUNWAY</div></header>
  <section class="card">
    <label class="label" for="prompt">Video prompt</label>
    <textarea id="prompt">A student doing a dynamic fitness warm-up in a modern school gym, cinematic camera movement, energetic and realistic.</textarea>
    <div class="grid"><div><label class="label" for="duration">Duration</label><select id="duration"><option value="5">5 seconds</option><option value="10">10 seconds</option></select></div><div><label class="label" for="aspect">Aspect ratio</label><select id="aspect"><option>9:16</option><option selected>16:9</option><option>1:1</option></select></div></div>
    <div style="margin-top:12px"><span class="label">Style</span><div class="styles" id="styles"><button class="chip active">Cinematic</button><button class="chip">Realistic</button><button class="chip">Anime</button><button class="chip">3D</button><button class="chip">Documentary</button></div></div>
    <button class="generate" id="generate">Generate real AI video</button><div class="status" id="status"></div>
    <div class="note">Your API key is not stored in this page. The browser calls your server, and the server calls the video API.</div>
  </section>
  <section class="card"><span class="label">Preview</span><div class="video-wrap" id="preview"><div class="empty">Your generated video will appear here.</div></div><div class="actions" id="actions" hidden><a class="action" id="openVideo" target="_blank" rel="noopener">Open video</a><a class="action" id="downloadVideo" download="ai-video.mp4">Save video</a></div></section>
  <section class="card"><span class="label">History</span><div id="history"><div class="empty" style="padding:25px">No generations yet.</div></div></section>
</main>
<script>
const $=id=>document.getElementById(id);let style='Cinematic';
$('styles').addEventListener('click',e=>{if(!e.target.classList.contains('chip'))return;document.querySelectorAll('.chip').forEach(x=>x.classList.remove('active'));e.target.classList.add('active');style=e.target.textContent});
function addHistory(prompt,url){const h=$('history');if(h.querySelector('.empty'))h.innerHTML='';const item=document.createElement('div');item.className='history-item';item.innerHTML='<div style="flex:1;min-width:0"><span></span><small>Generated just now</small></div>';item.querySelector('span').textContent=prompt;item.title=url;h.prepend(item)}
$('generate').onclick=async()=>{const prompt=$('prompt').value.trim();if(!prompt)return;const btn=$('generate');btn.disabled=true;$('status').textContent='Sending prompt to the AI video service…';$('actions').hidden=true;try{const r=await fetch('/api/generate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt,duration:Number($('duration').value),aspect:$('aspect').value,style})});const data=await r.json();if(!r.ok)throw new Error(data.error||'Generation failed');if(!data.videoUrl)throw new Error('The service returned no video URL.');$('preview').innerHTML='<video controls playsinline autoplay src="'+data.videoUrl+'"></video>';$('openVideo').href=data.videoUrl;$('downloadVideo').href=data.videoUrl;$('actions').hidden=false;addHistory(prompt,data.videoUrl);$('status').textContent='Video generated successfully.'}catch(e){$('status').textContent=e.message||'Something went wrong.'}finally{btn.disabled=false}};
</script>
</body>
</html>
